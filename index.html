<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORKOUT AI — ELITE DETECTION</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
        :root{--prime:#10b981;--glow:#34d399;--elite:#8b5cf6;--dark:#020617;--panel:rgba(15,23,42,0.94);--text:#f8fafc;--muted:#94a3b8;--warn:#f59e0b;--bad:#ef4444;--bone:#22d3ee;--joint:#fbbf24;--fire:#ef4444;--smooth:all 0.25s cubic-bezier(0.2,0.85,0.2,1);}
        html,body{height:100%;width:100%;background:radial-gradient(circle at 10% 0%,#064e3b 0%,#020617 50%,#000 100%);overflow:hidden;}
        .app{width:100%;height:100%;display:flex;flex-direction:column;padding:18px 16px;gap:14px;position:relative;}
        header{text-align:center;animation:rise 0.8s ease;}
        @keyframes rise{from{opacity:0;transform:translateY(20px);}}
        h1{font-size:clamp(42px,11vw,64px);font-weight:900;background:linear-gradient(90deg,var(--prime),var(--elite),var(--prime));-webkit-background-clip:text;color:transparent;letter-spacing:-1px;}
        .tag{color:var(--muted);font-size:clamp(14px,4vw,16px);margin-top:4px;}
        .page{display:none;flex-direction:column;gap:14px;flex:1;overflow-y:auto;padding-bottom:20px;position:relative;z-index:1;}
        .page.active{display:flex;animation:fadeIn 0.3s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}}
        .btn{padding:14px 18px;border-radius:16px;border:1px solid var(--prime);background:rgba(16,185,129,0.1);color:var(--prime);font-weight:600;font-size:16px;text-align:center;cursor:pointer;transition:var(--smooth);width:100%;pointer-events:auto;position:relative;z-index:100;user-select:none;-webkit-tap-highlight-color:transparent;}
        .btn.active{background:var(--prime);color:white;transform:translateY(-2px);box-shadow:0 0 25px rgba(16,185,129,0.3);}
        .btn-main{background:linear-gradient(135deg,var(--prime),var(--glow));border:none;color:white;}
        .btn-back{background:transparent;border:1px solid var(--muted);color:var(--muted);align-self:flex-start;max-width:120px;}
        .btn-skip{border-color:var(--warn);color:var(--warn);}
        .btn-save{border-color:var(--bone);color:var(--bone);}
        .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
        .full{grid-column:1/-1;}
        .inp{padding:12px 16px;border-radius:14px;border:1px solid rgba(16,185,129,0.3);background:rgba(15,23,42,0.7);color:white;font-size:16px;outline:none;position:relative;z-index:100;}
        .cam-wrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--prime);box-shadow:0 0 35px rgba(16,185,129,0.25);flex:1;min-height:280px;background:#050505;}
        video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);position:absolute;top:0;left:0;}
        #skeleton{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);}
        .overlay{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.9));z-index:10;}
        .status{font-weight:700;font-size:19px;margin-bottom:6px;}
        .good{color:var(--prime);} .warn{color:var(--warn);} .fix{color:var(--bad);} .elite{color:var(--elite);}
        .counter{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.75);border:1px solid var(--bone);border-radius:12px;padding:10px 16px;text-align:center;z-index:10;box-shadow:0 0 15px rgba(34,211,238,0.2);}
        .rep-num{font-size:36px;font-weight:900;color:var(--bone);line-height:1;}
        .feedback{margin-top:8px;padding:10px;background:rgba(0,0,0,0.4);border-radius:10px;font-size:14px;line-height:1.5;}
        .simple-view{background:var(--panel);border-radius:16px;padding:16px;border:1px solid var(--bone);display:none;}
        .simple-view.show{display:block;}
        .custom-list{background:var(--panel);border-radius:16px;padding:12px;border:1px solid rgba(16,185,129,0.15);}
        .custom-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
        .btn-del{border-color:var(--bad);color:var(--bad);padding:8px 12px;max-width:60px;}
    </style>
</head>
<body>
<div class="app">
<div class="page active" id="p1">
    <header><h1>WORKOUT AI</h1><p class="tag">🚀 ELITE DETECTION • REP-BY-REP COACHING</p></header>
    <h3 style="color:var(--text);margin-bottom:8px;">Your Goal</h3>
    <div class="grid" id="goalGroup">
        <button class="btn" data-val="Lose Weight">🔥 Lose Weight</button>
        <button class="btn active" data-val="Build Muscle">💪 Build Muscle</button>
        <button class="btn" data-val="Tone & Shape">✨ Tone & Shape</button>
        <button class="btn" data-val="Endurance">⚡ Endurance</button>
    </div>
    <h3 style="color:var(--text);margin:16px 0 8px;">Difficulty</h3>
    <div class="grid" id="levelGroup">
        <button class="btn" data-val="Easy">🟢 Easy</button>
        <button class="btn active" data-val="Medium">🟡 Medium</button>
        <button class="btn" data-val="Hard">🔴 Hard</button>
        <button class="btn" data-val="Ultimate">⚡ ULTIMATE</button>
    </div>
    <div class="grid" style="margin-top:8px;">
        <button class="btn" id="btnBody">🎯 Body Part</button>
        <button class="btn" id="btnCustom">✏️ Custom</button>
    </div>
</div>
<div class="page" id="p2">
    <button class="btn btn-back" id="btnBack1">← Back</button>
    <h3 style="color:var(--text);margin-bottom:8px;">What to train?</h3>
    <div class="grid" id="targetGroup">
        <button class="btn active" data-val="Full Body">💪 Full Body</button>
        <button class="btn" data-val="Upper Body">🦾 Upper</button>
        <button class="btn" data-val="Lower Body">🦵 Lower</button>
        <button class="btn" data-val="Core & Abs">🧱 Core</button>
    </div>
    <button class="btn btn-main full" id="btnRandom">🎲 RANDOM PLAN</button>
    <button class="btn btn-save full" id="btnSave1">📅 SAVE FOR TOMORROW</button>
    <button class="btn btn-main full" id="btnStart">▶️ START</button>
</div>
<div class="page" id="p3">
    <button class="btn btn-back" id="btnBack2">← Back</button>
    <h3 style="color:var(--text);">✏️ Build Your Own</h3>
    <input type="text" class="inp" id="exNameInp" placeholder="Exercise name">
    <div class="grid"><input type="text" class="inp" id="exSetInp" placeholder="Sets"><input type="text" class="inp" id="exRepInp" placeholder="Reps"></div>
    <button class="btn" id="btnAdd">➕ ADD</button>
    <div class="custom-list" id="customList"></div>
    <button class="btn btn-save full" id="btnSave2">📅 SAVE</button>
    <button class="btn btn-main full" id="btnUseCustom">✅ START</button>
</div>
<div class="page" id="p4">
    <button class="btn btn-back" id="btnBack3">← End</button>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div><div style="font-size:22px;font-weight:700;color:var(--prime);" id="exName">Ready</div><div style="font-size:14px;color:var(--muted);" id="exInfo"></div></div>
        <div style="font-size:24px;font-weight:800;color:var(--prime);" id="timer">00:00</div>
    </div>
    <div class="cam-wrap">
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="skeleton"></canvas>
        <div class="counter"><div class="rep-num" id="repCount">0</div><div style="font-size:11px;color:var(--muted);margin-top:2px;">REPS</div></div>
        <div class="overlay">
            <div class="status good" id="formStatus">✅ Loading Elite AI...</div>
            <div class="feedback" id="feedback">Stand in view — let's get to work!</div>
        </div>
    </div>
    <div class="simple-view" id="simpleBox"><h4 style="color:var(--bone);margin-bottom:6px;">📋 INSTRUCTIONS</h4><p style="color:var(--text);line-height:1.5;" id="simpleText"></p></div>
    <div class="grid">
        <button class="btn" id="btnPrev">← PREV</button>
        <button class="btn btn-skip" id="btnSkip">🙅 SKIP</button>
        <button class="btn btn-save" id="btnSave3">📅 SAVE</button>
        <button class="btn" id="btnSimple">📝 SIMPLE</button>
    </div>
</div>
</div>

<script>
let goal='Build Muscle', level='Medium', target='Full Body', exList=[], exIndex=0, reps=0, timer=0, timerInt;
let customList=[], simpleMode=false, detector=null, stream=null, lastPos=null, lastFeedback='';

const MOTIVATION = [
  "🔥 That’s how you do it! Keep pushing!",
  "💪 Strong rep! You’re getting better every second.",
  "⚡ Perfect control — elite effort!",
  "🚀 Don’t stop now — you’re building something real.",
  "🏆 That’s a winner — consistency is key!",
  "✨ Every rep counts — you’re proving it.",
  "💯 100% effort — I see it, keep going!",
  "🎯 Right on target — stay locked in!"
];

const LIBRARY={
    'Lose Weight':{'Full Body':[{name:'Jump Squat',sets:'4×15',tip:'Feet wide, sit deep, explode up',ok:'Perfect rhythm — land soft',fix:'Knees push out, chest up tall'},{name:'Mountain Climbers',sets:'3×40s',tip:'Plank, drive knees fast',ok:'Lightning pace — awesome',fix:'Keep hips low, core tight'}]},
    'Build Muscle':{'Full Body':[{name:'Deep Squat',sets:'4×12',tip:'Full depth, control up slow',ok:'Perfect depth — solid strength',fix:'Knees follow toes, do not round back'},{name:'Slow Push-Up',sets:'4×10',tip:'2s down, 1s up',ok:'Master control — excellent',fix:'Elbows 45°, not flared wide'}]},
    'Tone & Shape':{'Full Body':[{name:'Sumo Squat',sets:'3×15',tip:'Wide stance, toes pointed out',ok:'Great form — steady power',fix:'Weight in your heels, chest proud'}]},
    'Endurance':{'Full Body':[{name:'Squat Jumps',sets:'5×12',tip:'Continuous flow, land soft',ok:'Unstoppable stamina!',fix:'Bend knees to absorb impact'}]}
};
['Upper Body','Lower Body','Core & Abs'].forEach(p=>Object.keys(LIBRARY).forEach(g=>{if(!LIBRARY[g][p])LIBRARY[g][p]=LIBRARY[g]['Full Body'];}));

function nextPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(`p${n}`).classList.add('active');}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeRandomWorkout(){exList=shuffle([...LIBRARY[goal][target]]).slice(0,4);alert(`✅ ELITE ${goal} plan ready`);}
function addCustomEx(){let n=document.getElementById('exNameInp').value.trim();if(!n)return alert('Type exercise name');let s=document.getElementById('exSetInp').value||'3',r=document.getElementById('exRepInp').value||'12';customList.push({name:n,sets:`${s}×${r}`,tip:'Follow skeleton guide',ok:'Solid rep — keep it up',fix:'Adjust slowly, focus on form'});updateCustomUI();document.getElementById('exNameInp').value=document.getElementById('exSetInp').value=document.getElementById('exRepInp').value='';}
function updateCustomUI(){document.getElementById('customList').innerHTML=customList.length?customList.map((e,i)=>`<div class="custom-item"><div><strong>${e.name}</strong><br><small>${e.sets}</small></div><button class="btn btn-del" data-i="${i}">✕</button></div>`).join(''):'<p style="color:var(--muted);">Nothing added yet</p>';document.querySelectorAll('.btn-del').forEach(b=>b.onclick=()=>{customList.splice(b.dataset.i,1);updateCustomUI();});}
function useCustomWorkout(){if(!customList.length)return alert('Add at least one exercise');exList=[...customList];customList=[];startWorkout();}
function skipThis(){exList.splice(exIndex,1);if(!exList.length)return alert('All done — make new plan');showEx();reps=0;}
function saveForTomorrow(){localStorage.setItem('savedWorkout',JSON.stringify({goal,level,exList}));alert('✅ Saved — see you tomorrow!');}
function toggleSimple(){simpleMode=!simpleMode;document.getElementById('simpleBox').classList.toggle('show',simpleMode);}
function showEx(){let e=exList[exIndex];document.getElementById('exName').textContent=e.name;document.getElementById('exInfo').textContent=`${e.sets} | ${goal} • ${level}`;document.getElementById('simpleText').textContent=e.tip;reps=0;document.getElementById('repCount').textContent=0;document.getElementById('feedback').textContent=`Start moving — ${e.tip}`;}
function nextEx(){exIndex=(exIndex+1)%exList.length;showEx();startTimer();}
function prevEx(){exIndex=(exIndex-1+exList.length)%exList.length;showEx();startTimer();}
function startTimer(){clearInterval(timerInt);timer=0;timerInt=setInterval(()=>{let m=Math.floor(timer/60).toString().padStart(2,'0');let s=(timer%60).toString().padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`;},1000);}

async function initPose(){detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {modelType: poseDetection.SupportedModels.MoveNetType.SINGLEPOSE_LIGHTNING});}
async function draw(){if(!detector||!stream)return requestAnimationFrame(draw);const poses=await detector.estimatePoses(cam, {flipHorizontal: false});const ctx=skeleton.getContext('2d');skeleton.width=cam.videoWidth;skeleton.height=cam.videoHeight;ctx.clearRect(0,0,skeleton.width,skeleton.height);if(poses.length){const p=poses[0];const conn=[[5,6],[5,7],[7,9],[6,8],[8,10],[11,12],[11,13],[13,15],[12,14],[14,16],[5,11],[6,12]];ctx.strokeStyle='#22d3ee';ctx.lineWidth=4;conn.forEach(([a,b])=>{const kp1=p.keypoints[a],kp2=p.keypoints[b];if(kp1.score>0.5&&kp2.score>0.5){ctx.beginPath();ctx.moveTo(kp1.x,kp1.y);ctx.lineTo(kp2.x,kp2.y);ctx.stroke();}});ctx.fillStyle='#fbbf24';p.keypoints.forEach(kp=>{if(kp.score>0.5){ctx.beginPath();ctx.arc(kp.x,kp.y,7,0,2*Math.PI);ctx.fill();}});checkRepAndFeedback(p);}requestAnimationFrame(draw);}
function calcAngle(a,b,c){if(!a||!b||!c)return 0;const ab=Math.atan2(a.y-b.y,a.x-b.x);const cb=Math.atan2(c.y-b.y,c.x-b.x);let ang=Math.abs(ab-cb)*180/Math.PI;return ang>180?360-ang:ang;}
function giveFeedback(msg, type){lastFeedback=msg;document.getElementById('feedback').innerHTML=msg;document.getElementById('formStatus').className=`status ${type}`;}
function checkRepAndFeedback(pose){
    const hip=pose.keypoints[11],knee=pose.keypoints[13],ankle=pose.keypoints[15],shoulder=pose.keypoints[5];
    if(!hip||!knee||!ankle||!shoulder)return;
    const kneeAng=calcAngle(hip,knee,ankle);
    const backAng=calcAngle(shoulder,hip,knee);
    const e=exList[exIndex];

    if(lastPos==='up'&&kneeAng<95){
        lastPos='down';
        if(backAng<150) giveFeedback(`⚠️ Going deep — keep back straight next time! ${e.fix}`, 'warn');
        else giveFeedback(`⬇️ Good depth — now push up strong!`, 'good');
    }
    if(lastPos==='down'&&kneeAng>165){
        lastPos='up';
        reps++;
        document.getElementById('repCount').textContent=reps;
        const mot=MOTIVATION[Math.floor(Math.random()*MOTIVATION.length)];
        if(backAng>160) giveFeedback(`✅ REP ${reps} COMPLETE! ${mot}<br>💡 Form: Perfect — keep it!`, 'elite');
        else giveFeedback(`✅ REP ${reps} DONE! ${mot}<br>💡 Next time: ${e.fix}`, 'good');
    }
}

async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:800,height:600}});cam.srcObject=stream;await initPose();draw();startTimer();giveFeedback('✅ ELITE AI READY — start moving!','elite');lastPos='up';}catch{alert('Allow camera to use AI');}}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());clearInterval(timerInt);detector=null;}
function startWorkout(){if(!exList.length)exList=LIBRARY[goal][target];exIndex=0;showEx();nextPage(4);startCam();}

window.onload=()=>{
    document.querySelectorAll('#goalGroup .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#goalGroup .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');goal=b.dataset.val;});
    document.querySelectorAll('#levelGroup .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#levelGroup .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.val;});
    document.querySelectorAll('#targetGroup .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#targetGroup .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');target=b.dataset.val;});

    document.getElementById('btnBody').onclick=()=>nextPage(2);
    document.getElementById('btnCustom').onclick=()=>nextPage(3);
    document.getElementById('btnBack1').onclick=()=>nextPage(1);
    document.getElementById('btnBack2').onclick=()=>nextPage(1);
    document.getElementById('btnBack3').onclick=()=>{stopCam();nextPage(1);};
    document.getElementById('btnRandom').onclick=makeRandomWorkout;
    document.getElementById('btnSave1').onclick=saveForTomorrow;
    document.getElementById('btnSave2').onclick=saveForTomorrow;
    document.getElementById('btnSave3').onclick=saveForTomorrow;
    document.getElementById('btnStart').onclick=startWorkout;
    document.getElementById('btnAdd').onclick=addCustomEx;
    document.getElementById('btnUseCustom').onclick=useCustomWorkout;
    document.getElementById('btnPrev').onclick=prevEx;
    document.getElementById('btnSkip').onclick=skipThis;
    document.getElementById('btnSimple').onclick=toggleSimple;

    let s=localStorage.getItem('savedWorkout');
    if(s&&confirm('Load saved plan?')){let d=JSON.parse(s);goal=d.goal;level=d.level;exList=d.exList;}
};
</script>
</body>
</html>
